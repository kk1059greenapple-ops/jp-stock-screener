name: Update stock scores

on:
  schedule:
    # 平日 16:30 JST (市場終了後) = 07:30 UTC
    - cron: "30 7 * * 1-5"
  workflow_dispatch:
    inputs:
      min_price:
        description: "最低株価(円)"
        default: "0"
      max_price:
        description: "最高株価(円)"
        default: "100000"

permissions:
  contents: write

concurrency:
  group: stock-data-pipeline
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        run: |
          python scripts/run_all.py \
            --min-price "${{ github.event.inputs.min_price || '0' }}" \
            --max-price "${{ github.event.inputs.max_price || '100000' }}"

      - name: Copy data for GitHub Pages
        run: |
          mkdir -p docs/data
          cp data/universe.json data/prices.json data/scores.json docs/data/

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json docs/data/*.json
          git diff --quiet --cached || git commit -m "chore: update stock scores"
          git pull --rebase origin main
          git push
